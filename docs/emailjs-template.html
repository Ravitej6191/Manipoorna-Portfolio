<!--
  EmailJS template for the portfolio contact form: paste everything below the comment into the template's
  "Edit content" > "Code editor". Variables the form sends: {{name}} {{email}} {{reply_to}} {{message}} {{time}}.

  Template settings (the "Settings" tab):
    Subject:    New message from {{name}} · Portfolio
    To Email:   your own address
    From Name:  Portfolio contact form
    Reply To:   {{reply_to}}
-->
<div style="margin:0;padding:0;background:#e9edf6;">
  <!-- preview text shown next to the subject in the inbox -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#e9edf6;">{{name}} wrote to you through your portfolio: {{message}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#e9edf6;">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#fbf9f3;border:2px solid #0b1f4d;">

          <!-- header band, in the blueprint blue -->
          <tr>
            <td style="background:#0d3b8e;padding:22px 28px;border-bottom:4px solid #ffe08a;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="52" valign="middle">
                    <div style="width:44px;height:44px;line-height:44px;text-align:center;background:#fbf9f3;color:#0b1f4d;font-family:Menlo,Consolas,'Courier New',monospace;font-size:16px;font-weight:bold;letter-spacing:1px;">MP</div>
                  </td>
                  <td valign="middle" style="padding-left:14px;">
                    <div style="font-family:Menlo,Consolas,'Courier New',monospace;font-size:11px;letter-spacing:3px;color:#ffe08a;text-transform:uppercase;">New message</div>
                    <div style="margin-top:4px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:22px;font-weight:300;color:#ffffff;">Someone wrote to you</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- who and when, laid out like a title block -->
          <tr>
            <td style="padding:26px 28px 0 28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1.5px solid #0b1f4d;">
                <tr>
                  <td width="50%" valign="top" style="padding:12px 14px;border-right:1px solid #0b1f4d;border-bottom:1px solid #0b1f4d;">
                    <div style="font-family:Menlo,Consolas,'Courier New',monospace;font-size:10px;letter-spacing:2px;color:#6b7691;text-transform:uppercase;">From</div>
                    <div style="margin-top:6px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;color:#0b1f4d;"><strong>{{name}}</strong></div>
                  </td>
                  <td width="50%" valign="top" style="padding:12px 14px;border-bottom:1px solid #0b1f4d;">
                    <div style="font-family:Menlo,Consolas,'Courier New',monospace;font-size:10px;letter-spacing:2px;color:#6b7691;text-transform:uppercase;">Received</div>
                    <div style="margin-top:6px;font-family:Menlo,Consolas,'Courier New',monospace;font-size:13px;color:#0b1f4d;">{{time}}</div>
                  </td>
                </tr>
                <tr>
                  <td colspan="2" valign="top" style="padding:12px 14px;">
                    <div style="font-family:Menlo,Consolas,'Courier New',monospace;font-size:10px;letter-spacing:2px;color:#6b7691;text-transform:uppercase;">Reply to</div>
                    <div style="margin-top:6px;font-family:Menlo,Consolas,'Courier New',monospace;font-size:14px;"><a href="mailto:{{reply_to}}" style="color:#1d4fd7;text-decoration:none;border-bottom:1px solid #1d4fd7;">{{reply_to}}</a></div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- the message itself -->
          <tr>
            <td style="padding:26px 28px 0 28px;">
              <div style="font-family:Menlo,Consolas,'Courier New',monospace;font-size:10px;letter-spacing:3px;color:#d4442a;text-transform:uppercase;">Message</div>
              <div style="margin-top:10px;padding:18px 20px;background:#ffffff;border:1px solid #cfd6e6;border-left:4px solid #d4442a;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#1b2540;white-space:pre-wrap;word-wrap:break-word;">{{message}}</div>
            </td>
          </tr>

          <!-- one-click reply -->
          <tr>
            <td style="padding:26px 28px 30px 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background:#0b1f4d;">
                    <a href="mailto:{{reply_to}}?subject=Re:%20Your%20message%20on%20my%20portfolio" style="display:inline-block;padding:14px 22px;font-family:Menlo,Consolas,'Courier New',monospace;font-size:12px;letter-spacing:2px;color:#ffffff;text-decoration:none;text-transform:uppercase;">Reply to {{name}} &rarr;</a>
                  </td>
                </tr>
              </table>
              <div style="margin-top:14px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;color:#6b7691;">Or just hit reply: this email's Reply-To is set to {{reply_to}}.</div>
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td style="padding:14px 28px;background:#eef1f8;border-top:1px solid #cfd6e6;font-family:Menlo,Consolas,'Courier New',monospace;font-size:10px;letter-spacing:2px;color:#6b7691;text-transform:uppercase;">
              Sent from the contact form on your portfolio
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
